worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # 日志（排查用；量大时可关掉 access_log）
    access_log /var/log/nginx/maker.access.log;
    error_log  /var/log/nginx/maker.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    # 视频不压缩（mp4 已是压缩格式）

    # ---------- 展台：HTTP ----------
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        root  /srv/maker/current;
        index index.html;

        # 不缓存 HTML 与配置：每次刷新都拿到最新内容
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location ~* ^/js/(config|intro|poster|app)\.js$ {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        # 静态资源与视频：缓存 7 天（更新后文件名不变，靠下面一次强刷即可）
        location ~* \.(css|png|jpe?g|svg|webp|gif|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        location ~* \.(mp4|webm)$ {
            expires 7d;
            add_header Cache-Control "public";
            add_header Accept-Ranges bytes;
            try_files $uri =404;
        }

        # 预览截图、素材等目录直接可访问
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 健康检查
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }

    # ---------- 可选：HTTPS（把证书放到下面路径并取消注释） ----------
    # server {
    #     listen 443 ssl http2;
    #     server_name maker.example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     root  /srv/maker/current;
    #     index index.html;
    #     location / { try_files $uri $uri/ /index.html; }
    # }
}
